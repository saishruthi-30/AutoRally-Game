plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def gdxVersion = '1.12.1'

android {
    namespace 'com.autorally'
    compileSdk 34
    defaultConfig {
        applicationId 'com.autorally'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1-phase1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    sourceSets { main { jniLibs.srcDirs = ['libs'] } }
    buildTypes { release { minifyEnabled false } }
}

configurations { natives }

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}

// Unpacks LibGDX's native .so files into app/libs/<abi> before packaging
tasks.register('copyAndroidNatives') {
    doFirst {
        def abis = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
        abis.each { file("libs/$it").mkdirs() }
        configurations.natives.copy().files.each { jar ->
            def abi = abis.find { jar.name.endsWith("natives-${it}.jar") }
            if (abi) {
                copy { from zipTree(jar); into file("libs/$abi"); include '*.so' }
            }
        }
    }
}
tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach {
    dependsOn 'copyAndroidNatives'
}
